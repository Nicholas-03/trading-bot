name: Diagnose Production

on:
  workflow_dispatch:
    inputs:
      since_hours:
        description: "How many hours of logs to inspect"
        required: false
        default: "72"
      tail_lines:
        description: "Recent matching log lines to print"
        required: false
        default: "160"

jobs:
  diagnose:
    name: Diagnose trading bot production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DROPLET_APP_DIR: ${{ vars.DROPLET_APP_DIR }}
      DROPLET_COMPOSE_DIR: ${{ vars.DROPLET_COMPOSE_DIR }}
      DROPLET_SERVICE: ${{ vars.DROPLET_SERVICE }}
      SINCE_HOURS: ${{ inputs.since_hours }}
      TAIL_LINES: ${{ inputs.tail_lines }}

    steps:
      - name: Run read-only diagnostics over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DROPLET_APP_DIR,DROPLET_COMPOSE_DIR,DROPLET_SERVICE,SINCE_HOURS,TAIL_LINES
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${DROPLET_APP_DIR:-/opt/trading-bot/app}"
            COMPOSE_DIR="${DROPLET_COMPOSE_DIR:-/opt/trading-bot}"
            SERVICE="${DROPLET_SERVICE:-trading-bot}"
            SINCE_HOURS="${SINCE_HOURS:-72}"
            TAIL_LINES="${TAIL_LINES:-160}"
            LOG_FILE="/tmp/trading-bot-diagnose.log"

            echo "== App =="
            cd "$APP_DIR"
            echo "head=$(git rev-parse HEAD)"
            echo "branch=$(git rev-parse --abbrev-ref HEAD)"
            echo "status=$(git status --short | wc -l) modified-files"

            echo "== Container =="
            cd "$COMPOSE_DIR"
            docker compose ps "$SERVICE"
            docker compose logs --since "${SINCE_HOURS}h" --no-color "$SERVICE" > "$LOG_FILE" || true

            echo "== Runtime Config And DB =="
            docker cp "$APP_DIR/scripts/production_db_diagnostics.py" "$SERVICE":/tmp/production_db_diagnostics.py
            docker compose exec -T "$SERVICE" sh -lc "cd /app && python /tmp/production_db_diagnostics.py"

            echo "== Log Summary =="
            python3 "$APP_DIR/scripts/production_log_summary.py" "$LOG_FILE" "$TAIL_LINES"
