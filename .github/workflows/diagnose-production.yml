name: Diagnose Production

on:
  workflow_dispatch:
    inputs:
      since_hours:
        description: "How many hours of logs to inspect"
        required: false
        default: "72"
      tail_lines:
        description: "Recent matching log lines to print"
        required: false
        default: "160"

jobs:
  diagnose:
    name: Diagnose trading bot production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DROPLET_APP_DIR: ${{ vars.DROPLET_APP_DIR }}
      DROPLET_COMPOSE_DIR: ${{ vars.DROPLET_COMPOSE_DIR }}
      DROPLET_SERVICE: ${{ vars.DROPLET_SERVICE }}
      SINCE_HOURS: ${{ inputs.since_hours }}
      TAIL_LINES: ${{ inputs.tail_lines }}

    steps:
      - name: Run read-only diagnostics over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DROPLET_APP_DIR,DROPLET_COMPOSE_DIR,DROPLET_SERVICE,SINCE_HOURS,TAIL_LINES
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${DROPLET_APP_DIR:-/opt/trading-bot/app}"
            COMPOSE_DIR="${DROPLET_COMPOSE_DIR:-/opt/trading-bot}"
            SERVICE="${DROPLET_SERVICE:-trading-bot}"
            SINCE_HOURS="${SINCE_HOURS:-72}"
            TAIL_LINES="${TAIL_LINES:-160}"
            LOG_FILE="/tmp/trading-bot-diagnose.log"

            echo "== App =="
            cd "$APP_DIR"
            echo "head=$(git rev-parse HEAD)"
            echo "branch=$(git rev-parse --abbrev-ref HEAD)"
            echo "status=$(git status --short | wc -l) modified-files"

            echo "== Container =="
            cd "$COMPOSE_DIR"
            docker compose ps "$SERVICE"
            docker compose logs --since "${SINCE_HOURS}h" --no-color "$SERVICE" > "$LOG_FILE" || true

            echo "== Runtime Config And DB =="
            docker compose exec -T "$SERVICE" python - <<'PY'
            import sqlite3
            from collections import Counter
            from datetime import date, datetime, timedelta, timezone
            from zoneinfo import ZoneInfo

            from config import load_config

            cfg = load_config()
            print("config", {
                "paper": cfg.tradier_paper,
                "trade_amount_usd": cfg.trade_amount_usd,
                "allow_short": cfg.allow_short,
                "min_confidence": cfg.min_confidence,
                "min_trade_price": cfg.min_trade_price,
                "max_entry_spread_pct": cfg.max_entry_spread_pct,
                "min_entry_avg_volume": cfg.min_entry_avg_volume,
                "min_entry_avg_dollar_volume": cfg.min_entry_avg_dollar_volume,
                "default_hold_hours": cfg.default_hold_hours,
                "max_hold_hours": cfg.max_hold_hours,
                "close_before_market_close_minutes": cfg.close_before_market_close_minutes,
                "require_hard_catalyst_news": cfg.require_hard_catalyst_news,
                "block_soft_partnership_news": cfg.block_soft_partnership_news,
                "short_liquid_only": cfg.short_liquid_only,
                "entry_confirmation_enabled": cfg.entry_confirmation_enabled,
                "entry_confirmation_lookback_minutes": cfg.entry_confirmation_lookback_minutes,
                "entry_confirmation_trend_minutes": cfg.entry_confirmation_trend_minutes,
                "feed": cfg.alpaca_data_feed,
                "analytics_db_path": cfg.analytics_db_path,
            })

            con = sqlite3.connect(cfg.analytics_db_path)
            con.row_factory = sqlite3.Row
            et = ZoneInfo("America/New_York")

            def scalar(sql, params=()):
                return con.execute(sql, params).fetchone()[0]

            print("table_counts", {
                "news_events": scalar("SELECT COUNT(*) FROM news_events"),
                "llm_decisions": scalar("SELECT COUNT(*) FROM llm_decisions"),
                "trades": scalar("SELECT COUNT(*) FROM trades"),
                "account_value_snapshots": scalar("SELECT COUNT(*) FROM account_value_snapshots"),
            })
            print("latest_ts", {
                "news": scalar("SELECT MAX(ts) FROM news_events"),
                "decision": scalar("SELECT MAX(ts) FROM llm_decisions"),
                "trade_opened": scalar("SELECT MAX(opened_at) FROM trades"),
                "trade_closed": scalar("SELECT MAX(closed_at) FROM trades"),
                "account_value": scalar("SELECT MAX(ts) FROM account_value_snapshots"),
            })

            today_et = datetime.now(et).date()
            for day in [today_et - timedelta(days=2), today_et - timedelta(days=1), today_et]:
                start = datetime(day.year, day.month, day.day, tzinfo=et).astimezone(timezone.utc).isoformat()
                end = datetime((day + timedelta(days=1)).year, (day + timedelta(days=1)).month, (day + timedelta(days=1)).day, tzinfo=et).astimezone(timezone.utc).isoformat()
                decisions = con.execute(
                    "SELECT action, COUNT(*) cnt FROM llm_decisions WHERE ts >= ? AND ts < ? GROUP BY action",
                    (start, end),
                ).fetchall()
                skips = con.execute(
                    "SELECT skip_reason, COUNT(*) cnt FROM llm_decisions WHERE ts >= ? AND ts < ? AND skip_reason IS NOT NULL GROUP BY skip_reason ORDER BY cnt DESC",
                    (start, end),
                ).fetchall()
                trades = con.execute(
                    "SELECT ticker, side, opened_at, closed_at, pnl_usd, exit_reason FROM trades WHERE opened_at >= ? AND opened_at < ? ORDER BY opened_at",
                    (start, end),
                ).fetchall()
                acct = con.execute(
                    "SELECT ts, value_usd FROM account_value_snapshots WHERE ts >= ? AND ts < ? ORDER BY ts",
                    (start, end),
                ).fetchall()
                acct_summary = None
                if acct:
                    acct_summary = {
                        "first": (acct[0]["ts"], acct[0]["value_usd"]),
                        "last": (acct[-1]["ts"], acct[-1]["value_usd"]),
                        "delta": acct[-1]["value_usd"] - acct[0]["value_usd"],
                    }
                print("day", day.isoformat(), {
                    "decisions": {r["action"]: r["cnt"] for r in decisions},
                    "skip_reasons": {r["skip_reason"]: r["cnt"] for r in skips},
                    "trades": [dict(r) for r in trades],
                    "account": acct_summary,
                })

            recent = con.execute(
                "SELECT ts, action, ticker, confidence, skip_reason, reasoning FROM llm_decisions ORDER BY id DESC LIMIT 20"
            ).fetchall()
            print("recent_decisions")
            for r in recent:
                print(dict(r))
            PY

            echo "== Log Summary =="
            python3 - <<'PY'
            import collections
            import os
            import re
            from pathlib import Path

            log_path = Path("/tmp/trading-bot-diagnose.log")
            lines = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []
            skip_counts = collections.Counter()
            llm_counts = collections.Counter()
            markers = collections.Counter()
            for line in lines:
                if "News received:" in line:
                    markers["news_received"] += 1
                if "LLM decision" in line:
                    markers["llm_decision"] += 1
                    m = re.search(r"LLM decision \[[^\]]+\]:\s+(\w+)", line)
                    if m:
                        llm_counts[m.group(1)] += 1
                if "BUY TRIGGERED" in line:
                    markers["buy_triggered"] += 1
                if "BUY filled" in line:
                    markers["buy_filled"] += 1
                if "SHORT TRIGGERED" in line:
                    markers["short_triggered"] += 1
                if "SHORT filled" in line:
                    markers["short_filled"] += 1
                if "ORDER skipped" in line:
                    markers["order_skipped_notification"] += 1
                if "ERROR" in line:
                    markers["error_lines"] += 1
                m = re.search(r"SKIP \[([^\]]+)\]", line)
                if m:
                    skip_counts[m.group(1)] += 1
            print("markers", dict(markers))
            print("llm_actions", dict(llm_counts))
            print("skip_counts", dict(skip_counts.most_common(30)))

            interesting = [
                line for line in lines
                if any(token in line for token in (
                    "News received:", "SKIP [", "LLM decision", "BUY TRIGGERED",
                    "BUY PRE", "BUY filled", "SHORT TRIGGERED", "SHORT PRE",
                    "SHORT filled", "ORDER skipped", "ERROR", "Bot starting",
                ))
            ]
            tail = int(os.environ.get("TAIL_LINES", "160"))
            print("recent_matching_logs")
            for line in interesting[-tail:]:
                print(line)
            PY
